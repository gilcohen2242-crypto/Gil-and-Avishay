name: ESG market data build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy yfinance
      - name: Build metrics
        run: python esg_market_data/build_metrics.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: esg-market-data
          path: esg_market_data/output/
          if-no-files-found: error
