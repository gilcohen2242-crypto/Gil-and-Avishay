name: ESG fundamentals build

on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp_esg_fundamentals/**'
      - '.github/workflows/esg_fundamentals_build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance pandas numpy openpyxl
      - name: Build fundamentals
        run: python tmp_esg_fundamentals/build_fundamentals.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: esg-fundamentals-data
          path: tmp_esg_fundamentals/output/
          retention-days: 30
